[project]
name = "clarityime"
version = "0.6.0"
description = "IME-native audience comprehension — local clarify rules, cross-circle analogies, tag registry, contact learning, and optional share links (payload in URL fragment; server never sees message text)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "rich>=13.7.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1.0", "numpy>=1.24.0", "sounddevice>=0.4.6"]
desktop = ["keyboard>=0.13.5", "pyperclip>=1.8.2"]
all = ["clarityime[asr,desktop]"]

[project.scripts]
clarityime = "clarityime.main:main"
clarityime-serve = "clarityime.server:run_server"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clarityime*"]
